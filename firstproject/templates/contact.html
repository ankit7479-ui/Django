{% extends "base.html" %}
{%block title%}contact{%endblock title%}

{%block body%}
<div class="container-fluid px-0 mb-3">
    <img src="firstproject\static\img\kseniia-lobko-WKXjxw6042g-unsplash.jpg" class="d-block w-100 mx-0" alt="...">
</div>
 <div class="container mb-3">
    <h1 class="text-center">Contact</h1>
   <form method="post" action="/contact">
    {% csrf_token %}
    <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name ">
  </div>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" name="Email" placeholder="Enter your mail">
  </div>
  <div class="mb-3">
    <label for="phone" class="form-label">Phone Number</label>
    <input type="Numder" class="form-control" id="phone"  name="phone" placeholder="Enter your phone number">
  </div>
  <div class="mb-3">
    <label for="desc" class="form-label">Tell me about what you want to contact me...</label>
    <input type="text" class="form-control" id="desc" rows="3" name="desc">
  </div>
  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</div>
{%endblock body%}
